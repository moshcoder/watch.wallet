# bin/install.sh settings for watch.wallet (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/watch-wallet--prod (DATABASE_URL, WATCHWALLET_SECRET,
# RESEND_API_KEY, VAPID_*, COINPAY_*, TELNYX_*).
#
# DATABASE_URL points at a Postgres the box already runs, so POSTGRES=0:
# install.sh must not try to install a second Postgres on a port that is taken.
#
# DOMAINS is empty on purpose: watch.wallet is a Moshpit name, so there is no
# Let's Encrypt certificate to get. Its nginx vhost (/etc/moshpit/templates/
# watch.wallet.conf) proxies to PORT with the Moshpit-issued certificate.
APP=watch-wallet
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8802
HEALTH_PATH=/health
DOMAINS=
POSTGRES=0
ACCESS_LOG=off
